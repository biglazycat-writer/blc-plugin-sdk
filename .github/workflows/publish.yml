name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # setup-node 会把 ${NODE_AUTH_TOKEN} 写进 .npmrc，job 级提供后
    # 前面的 npm view 幂等检查也不会因占位符未替换而失败。
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          registry-url: 'https://registry.npmjs.org'

      # 幂等保护：同一个版本发过就跳过，避免重复触发 Release / 手动运行导致 E403。
      - name: Check version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -n "$RELEASE_TAG" ] && [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "::error::Release tag '$RELEASE_TAG' does not match package.json version 'v$VERSION'"
            exit 1
          fi
          if npm view "blc-plugin-sdk@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::blc-plugin-sdk@$VERSION is already published; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci
        if: steps.version.outputs.skip == 'false'
      - run: npm test
        if: steps.version.outputs.skip == 'false'
      - run: npm pack --dry-run
        if: steps.version.outputs.skip == 'false'

      - name: Publish
        if: steps.version.outputs.skip == 'false'
        run: npm publish --access public --provenance
